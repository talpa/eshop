name: Docker Dev Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-backend-dev:
    name: Build BE dev image
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push BE dev image
        uses: docker/build-push-action@v6.16.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eshop-backend:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eshop-backend:dev-${{ github.sha }}

  build-frontend-dev:
    name: Build FE dev image
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push FE dev image
        uses: docker/build-push-action@v6.16.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_DEV }}
            VITE_PACKETA_API_KEY=${{ secrets.VITE_PACKETA_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eshop-frontend:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/eshop-frontend:dev-${{ github.sha }}

  deploy-dev:
    name: Trigger Coolify dev deploy
    runs-on: ubuntu-24.04
    needs:
      - build-backend-dev
      - build-frontend-dev
    env:
      COOLIFY_WEBHOOK_BE_DEV: ${{ secrets.COOLIFY_WEBHOOK_BE_DEV }}
      COOLIFY_WEBHOOK_FE_DEV: ${{ secrets.COOLIFY_WEBHOOK_FE_DEV }}
      COOLIFY_API_TOKEN_DEV: ${{ secrets.COOLIFY_API_TOKEN_DEV }}

    steps:
      - name: Trigger BE dev deploy
        if: ${{ env.COOLIFY_WEBHOOK_BE_DEV != '' }}
        run: |
          URL="$COOLIFY_WEBHOOK_BE_DEV"
          TOKEN="${COOLIFY_API_TOKEN_DEV#Bearer }"
          TOKEN="${TOKEN#bearer }"

          call_webhook() {
            local header="$1"
            if [ -n "$header" ]; then
              curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL" -H "$header"
            else
              curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL"
            fi
          }

          if [ -z "$TOKEN" ]; then
            code=$(call_webhook "")
            echo "BE dev webhook HTTP $code"
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
            exit $?
          fi

          code=$(call_webhook "Authorization: Bearer $TOKEN")
          echo "BE dev webhook with Bearer HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi

          code=$(call_webhook "Authorization: $TOKEN")
          echo "BE dev webhook with raw Authorization HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi

          code=$(call_webhook "x-api-key: $TOKEN")
          echo "BE dev webhook with x-api-key HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Trigger FE dev deploy
        if: ${{ env.COOLIFY_WEBHOOK_FE_DEV != '' }}
        run: |
          URL="$COOLIFY_WEBHOOK_FE_DEV"
          TOKEN="${COOLIFY_API_TOKEN_DEV#Bearer }"
          TOKEN="${TOKEN#bearer }"

          call_webhook() {
            local header="$1"
            if [ -n "$header" ]; then
              curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL" -H "$header"
            else
              curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL"
            fi
          }

          if [ -z "$TOKEN" ]; then
            code=$(call_webhook "")
            echo "FE dev webhook HTTP $code"
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
            exit $?
          fi

          code=$(call_webhook "Authorization: Bearer $TOKEN")
          echo "FE dev webhook with Bearer HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi

          code=$(call_webhook "Authorization: $TOKEN")
          echo "FE dev webhook with raw Authorization HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi

          code=$(call_webhook "x-api-key: $TOKEN")
          echo "FE dev webhook with x-api-key HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
