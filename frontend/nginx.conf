server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets (Vite uses content hashes)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Cache uploaded images (served via backend, not here — but keep for safety)
    location /uploads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Never cache index.html (SPA entry point)
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache robots.txt for 1 day
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Sitemap — nginx sets text/xml by default for .xml; no add_header Content-Type
    # (adding it creates duplicate Content-Type headers which some crawlers reject)
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        text/javascript
        image/svg+xml
        application/manifest+json;
}
